<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAR 통합 경로 트리</title>
<style>
  :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #252537; background: #f4f4f7; --ease-out: cubic-bezier(.23,1,.32,1); }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: 100%; min-height: 100dvh; display: flex; flex-direction: column; padding: 28px 22px 60px; }
  h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.02em; line-height: 1.2; }
  p { margin: 0 0 18px; color: #6f6977; line-height: 1.6; }
  .panel { background: #fff; border: 1px solid #eceaf0; border-radius: 16px; padding: 18px; margin-top: 15px; box-shadow: 0 2px 6px rgba(0,0,0,.03), 0 14px 36px rgba(0,0,0,.04); }
  input, button { font: inherit; }
  input[type=file] { width: 100%; padding: 16px; border: 1px dashed #a59bca; border-radius: 12px; background: #faf9ff; color: #252537; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  .controls input[type=search] { flex:1; min-width:200px; padding:10px; border:1px solid #dcd8e5; border-radius:10px; color:#252537; }
  button { padding:9px 12px; border-radius:10px; border:1px solid #dcd8e5; background:#fff; color:#252537; cursor:pointer; transition:background-color 140ms var(--ease-out), border-color 140ms var(--ease-out), transform 140ms var(--ease-out); }
  button:active:not(:disabled) { transform:scale(.97); } button:disabled { opacity:.55; cursor:not-allowed; }
  .primary { background:#7667dc; border-color:#7667dc; color:#fff; }
  #status, #summary { color:#6f6977; font-size:14px; } #status { margin-left:auto; }
  #summary { margin:15px 0; }
  .panel:has(> .tree) { flex:1; display:flex; flex-direction:column; }
  .tree { flex:1; min-height:400px; overflow:auto; border:1px solid #eceaf0; border-radius:12px; background:#fafafc; padding:8px 12px; }
  details { margin-left:17px; border-left:1px solid #d1cce0; padding-left:12px; }
  .tree > details { margin-left:0; border:0; padding-left:0; }
  summary { cursor:pointer; padding:7px 4px; font-weight:650; overflow-wrap:anywhere; }
  .route { display:flex; align-items:center; flex-wrap:wrap; gap:7px; padding:8px 10px 8px 14px; margin-left:17px; border-left:1px solid #dcd8e5; border-top:1px solid #eceaf0; overflow-wrap:anywhere; }
  .route-path { min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .method, .badge { display:inline-block; border-radius:999px; padding:3px 7px; font-size:11px; font-weight:750; white-space:nowrap; }
  .method { min-width:54px; text-align:center; background:#eeeef2; color:#4f4e5b; }
  .method.get { background:#e8f2fd;color:#245b8b } .method.post { background:#e6f4ec;color:#276646 } .method.put { background:#fff1dc;color:#8b5a16 }
  .method.patch { background:#f0eaff;color:#6548a8 } .method.delete { background:#fbeaec;color:#a43f45 } .method.head { background:#e4f4f4;color:#236568 }
  .method.options { background:#e9edf2;color:#475569 } .method.connect { background:#e8edf9;color:#344f92 } .method.trace { background:#f3e9f3;color:#754575 }
  .badge { background:#e6f4ec;color:#276646 } .badge.candidate { background:#fff1dc;color:#8b5a16 }
  .badge.risk { background:#b42318;color:#fff; cursor:help; }
  .route.risk-row { background:#fff3f2; border-left-color:#b42318; }
  .empty { padding:20px; color:#6f6977; }
  .zoom-controls { position:fixed;right:18px;bottom:18px;z-index:10;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid #eceaf0;border-radius:12px;padding:5px;box-shadow:0 2px 6px rgba(0,0,0,.03),0 14px 36px rgba(0,0,0,.04); }
  .zoom-controls button { width:32px;height:32px;padding:0;font-size:17px;font-weight:700;line-height:1; }
  .zoom-controls span { width:46px;text-align:center;font-size:12px;color:#6f6977; }
  button:focus-visible,input:focus-visible,summary:focus-visible { outline:3px solid rgba(118,103,220,.38);outline-offset:2px; }
  @media (hover:hover) and (pointer:fine) { button:not(:disabled):hover { background:#f4f1ff;border-color:#8b80e4 } button.primary:hover { background:#5d50ba;border-color:#5d50ba } summary:hover,.route:hover { background:#f4f1ff } }
  @media (max-width:700px) { main { padding:18px 12px 60px } h1 { font-size:25px } #status { width:100%;margin:0 } }
  html.embedded main { height:100dvh;min-height:0;padding:8px;overflow:hidden; }
  html.embedded main > h1, html.embedded main > h1 + p { display:none; }
  html.embedded main > .panel { margin-top:6px;padding:10px;min-height:0; }
  html.embedded main > .panel:first-of-type { flex:0 0 auto; }
  html.embedded .panel:has(> .tree) { flex:1 1 auto; }
  html.embedded .tree { min-height:0; }
  html.embedded input[type=file] { padding:8px; }
  html.embedded .controls { margin-top:6px; }
  html.embedded #summary { margin:6px 0; }
</style>
</head>
<body onload="if(window.self!==window.top||new URLSearchParams(location.search).has('embedded'))document.documentElement.classList.add('embedded')">
<main id="zoomRoot">
  <h1>HAR 통합 경로 트리</h1>
  <p>HAR의 실제 요청과 JavaScript 응답 본문에서 추출한 후보 경로를 함께 표시합니다. 분석은 브라우저 안에서만 이루어지며 서버로 전송하지 않습니다.</p>
  <section class="panel">
    <input id="files" type="file" accept=".har,.json,application/json" multiple aria-label="HAR 파일 선택">
    <div class="controls"><button class="primary" id="analyze">분석하기</button><button id="clear">초기화</button><span id="status" role="status"></span></div>
  </section>
  <section class="panel">
    <div class="controls" style="margin-top:0">
      <input id="search" type="search" placeholder="경로, 도메인, 메서드 검색" aria-label="결과 검색">
      <input id="exclude" type="search" placeholder="제외 키워드 (| 로 구분)" aria-label="제외 키워드">
      <button id="expand">모두 펼치기</button><button id="collapse">모두 접기</button>
      <button id="copyAll" disabled title="필터와 관계없이 전체 결과의 고유 경로를 복사합니다">전체 경로 복사</button>
    </div>
    <div id="summary">HAR 파일을 선택해 주세요.</div>
    <div id="tree" class="tree"><div class="empty">분석 결과가 여기에 표시됩니다.</div></div>
  </section>
</main>
<div class="zoom-controls"><button id="zoomOut" type="button" title="축소" aria-label="축소">&minus;</button><span id="zoomLevel">100%</span><button id="zoomIn" type="button" title="확대" aria-label="확대">+</button></div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let results = [], stats = { requests:0, scripts:0, scriptBodies:0 };
  const staticExt = /\.(?:js|mjs|cjs|css|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot|mp4|webm|pdf)(?:$|[?#])/i;
  const adminTerms = ['admin','manage','internal','private','debug','console'];

  function parseUrl(raw, base) {
    if (typeof raw !== 'string') return null;
    let text = raw.trim().replace(/\\\//g,'/').replace(/\$\{[^}]+\}/g,'{…}');
    if (!text || /^(?:data|blob|javascript|mailto):/i.test(text) || /^\/(?:\/|\*)/.test(text)) return null;
    if (!/^(?:https?:)?\/\//i.test(text) && !text.startsWith('/')) {
      if (!/^(?:api|v\d+|graphql|rest)\//i.test(text)) return null;
      text = '/' + text;
    }
    try {
      const url = new URL(text.startsWith('//') ? 'https:' + text : text, base);
      if (!/^https?:$/.test(url.protocol)) return null;
      return { host:url.host.toLowerCase(), path:url.pathname || '/', origin:url.origin, params:[...url.searchParams.keys()] };
    } catch { return null; }
  }
  function add(map, data) {
    const key = [data.host,data.path,data.method].join('\u0000');
    if (!map.has(key)) map.set(key,{...data,params:new Set(),sources:new Set(),count:0});
    const item = map.get(key);
    for (const param of data.params || []) if (param) item.params.add(param);
    if (data.source) item.sources.add(data.source);
    item.count++;
  }
  function bodyParams(postData) {
    if (!postData || typeof postData !== 'object') return [];
    const names = new Set((postData.params || []).map(x => x.name).filter(Boolean));
    const raw = postData.text;
    if (typeof raw !== 'string') return [...names];
    const mime = postData.mimeType || '';
    if (/json/i.test(mime)) {
      try { const visit=(v,p='',d=0)=>{ if(!v||typeof v!=='object'||d>4)return; for(const [k,n] of Object.entries(v)){const name=p?p+'.'+k:k;names.add(name);visit(n,name,d+1);} }; visit(JSON.parse(raw)); } catch {}
    } else if (/x-www-form-urlencoded/i.test(mime)) for (const key of new URLSearchParams(raw).keys()) names.add(key);
    return [...names];
  }
  function responseText(content) {
    if (!content || typeof content.text !== 'string') return null;
    if (content.encoding !== 'base64') return content.text;
    try { const binary=atob(content.text), bytes=Uint8Array.from(binary,c=>c.charCodeAt(0)); return new TextDecoder('utf-8',{fatal:false}).decode(bytes); } catch { return null; }
  }
  function jsCandidates(code, source, map) {
    const push=(raw,method='?')=>{ const p=parseUrl(raw,source); if(p&&!staticExt.test(p.path)) add(map,{...p,kind:'candidate',method,params:p.params,source}); };
    const calls=/\b(?:axios\s*\.\s*(get|post|put|patch|delete|head|options)|fetch)\s*\(\s*(["'`])((?:\\.|(?!\2)[^\\])*?)\2/gi;
    for(const m of code.matchAll(calls)) push(m[3],m[1]?m[1].toUpperCase():'?');
    const literals=/("|'|`)((?:\\.|(?!\1)[^\\])*?)\1/g;
    for(const m of code.matchAll(literals)) if(/^(?:https?:)?\/\//i.test(m[2])||m[2].startsWith('/')||/^(?:api|v\d+|graphql|rest)\//i.test(m[2])) push(m[2]);
  }
  function analyzeHar(har, observed, candidates) {
    const entries=har?.log?.entries;
    if(!Array.isArray(entries)) throw new Error('HAR 형식이 아닙니다 (log.entries 없음).');
    for(const entry of entries) {
      const req=entry?.request; if(!req?.url) continue; stats.requests++;
      const parsed=parseUrl(req.url);
      if(parsed) add(observed,{...parsed,kind:'observed',method:String(req.method||'?').toUpperCase(),params:[...parsed.params,...(req.queryString||[]).map(x=>x.name),...bodyParams(req.postData)],source:req.url});
      const content=entry.response?.content;
      if(!(/(?:java|ecma)script/i.test(content?.mimeType||'')||/\.(?:js|mjs|cjs)(?:$|[?#])/i.test(req.url))) continue;
      stats.scripts++; const code=responseText(content); if(code===null) continue;
      stats.scriptBodies++; jsCandidates(code,req.url,candidates);
    }
  }
  function finalize(observed,candidates) {
    const merged=new Map();
    for(const [kind,map] of [['observed',observed],['candidate',candidates]]) for(const item of map.values()) {
      const key=[item.host,item.path,item.method].join('\u0000');
      if(!merged.has(key)) merged.set(key,{...item,kindSet:new Set(),params:new Set(),sources:new Set(),count:0});
      const target=merged.get(key); target.kindSet.add(kind); target.count+=item.count;
      for(const p of item.params) target.params.add(p); for(const s of item.sources) target.sources.add(s);
    }
    const origins = new Map();
    for (const item of merged.values()) {
      const pathKey = item.host + '\u0000' + item.path;
      if (!origins.has(pathKey)) origins.set(pathKey, new Set());
      for (const kind of item.kindSet) origins.get(pathKey).add(kind);
    }
    for (const item of merged.values()) item.kindSet = origins.get(item.host + '\u0000' + item.path);
    return [...merged.values()].sort((a,b)=>(a.host+a.path+a.method).localeCompare(b.host+b.path+b.method));
  }
  function visible() {
    const q=$('search').value.trim().toLocaleLowerCase(), excluded=$('exclude').value.split('|').map(x=>x.trim().toLocaleLowerCase()).filter(Boolean);
    return results.filter(x=>{const text=`${x.host} ${x.path} ${x.method} ${[...x.params].join(' ')}`.toLocaleLowerCase();return (!q||text.includes(q))&&!excluded.some(k=>text.includes(k));});
  }
  function makeNode(){return {children:new Map(),routes:[]};}
  function build(items) {
    const root=makeNode();
    for(const item of items){let n=root;for(const part of [item.host,...item.path.split('/').filter(Boolean)]){if(!n.children.has(part))n.children.set(part,makeNode());n=n.children.get(part);}n.routes.push(item);}
    return root;
  }
  function routeRow(item) {
    const row=document.createElement('div');row.className='route';
    const method=document.createElement('span');method.className='method '+item.method.toLowerCase().replace(/[^a-z0-9_-]/g,'');method.textContent=item.method;row.append(method);
    const path=document.createElement('span');path.className='route-path';path.textContent=item.path;path.title=`${item.host}${item.path}`;row.append(path);
    if(item.kindSet.has('observed')){const b=document.createElement('span');b.className='badge';b.textContent='실제 요청(HAR)';b.title=`HAR에서 ${item.count}회 관측`;row.append(b);}
    if(item.kindSet.has('candidate')){const b=document.createElement('span');b.className='badge candidate';b.textContent='JS 추출(추정)';b.title=`${item.sources.size}개 JS 응답에서 추출`;row.append(b);}
    if(adminTerms.some(term=>item.path.toLowerCase().includes(term))){const b=document.createElement('span');b.className='badge risk';b.textContent='관리 경로 의심';b.title='인증우회/권한상승 의심 — 비인증 상태로 직접 수동 테스트할 것. 정적 표시이며 네트워크 요청을 보내지 않습니다.';row.append(b);row.classList.add('risk-row');}
    return row;
  }
  function populate(details,node,depth) {
    if(details.dataset.loaded==='1') return;
    details.dataset.loaded='1';
    for(const item of node.routes) details.append(routeRow(item));
    for(const [name,child] of [...node.children].sort((a,b)=>a[0].localeCompare(b[0]))) {
      const nested=document.createElement('details');nested.open=depth<1;
      nested._treeNode=child;nested._treeDepth=depth+1;
      const summary=document.createElement('summary');summary.textContent=name;summary.title=name;nested.append(summary);
      nested.addEventListener('toggle',()=>{if(nested.open)populate(nested,child,depth+1);},{once:true});
      if(nested.open) populate(nested,child,depth+1);
      details.append(nested);
    }
  }
  function render() {
    const items=visible(), tree=$('tree');tree.replaceChildren();
    if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='표시할 경로가 없습니다.';tree.append(e);}
    else {
      const root=build(items);
      for(const [name,child] of [...root.children].sort((a,b)=>a[0].localeCompare(b[0]))) {
        const d=document.createElement('details');d.open=true;d._treeNode=child;d._treeDepth=0;const s=document.createElement('summary');s.textContent=name;s.title=name;d.append(s);
        d.addEventListener('toggle',()=>{if(d.open)populate(d,child,0);});populate(d,child,0);tree.append(d);
      }
    }
    $('summary').textContent=`${items.length}개 표시 / 전체 ${results.length}개 메서드별 경로 · 실제 요청 ${results.filter(x=>x.kindSet.has('observed')).length}개 · JS 추출 ${results.filter(x=>x.kindSet.has('candidate')).length}개 · JS 응답 본문 ${stats.scriptBodies}/${stats.scripts}개 분석`;
    $('copyAll').disabled=!results.length;
  }
  async function copyText(text,button) {
    try { await navigator.clipboard.writeText(text); }
    catch { const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove(); }
    if(button){const old=button.textContent;button.textContent='복사됨';setTimeout(()=>button.textContent=old,1200);}
  }
  $('analyze').addEventListener('click',async()=>{
    const files=[...$('files').files];if(!files.length){$('status').textContent='HAR 파일을 선택해 주세요.';return;}
    $('status').textContent='분석 중…';const observed=new Map(),candidates=new Map();stats={requests:0,scripts:0,scriptBodies:0};
    try { for(const file of files) analyzeHar(JSON.parse(await file.text()),observed,candidates);results=finalize(observed,candidates);render();$('status').textContent=`${files.length}개 HAR, ${stats.requests}개 요청 분석 완료`; }
    catch(error){$('status').textContent=`분석 실패: ${error.message}`;}
  });
  $('clear').addEventListener('click',()=>{$('files').value='';$('search').value='';$('exclude').value='';results=[];stats={requests:0,scripts:0,scriptBodies:0};$('tree').replaceChildren();$('summary').textContent='HAR 파일을 선택해 주세요.';$('status').textContent='';$('copyAll').disabled=true;});
  $('search').addEventListener('input',render);$('exclude').addEventListener('input',render);
  $('copyAll').addEventListener('click',()=>{const paths=[...new Set(results.map(x=>x.path))].sort();copyText(paths.join('\n'),$('copyAll'));});
  $('expand').addEventListener('click',()=>{
    const openBranch=d=>{d.open=true;populate(d,d._treeNode,d._treeDepth);for(const child of d.querySelectorAll(':scope > details'))openBranch(child);};
    for(const d of $('tree').querySelectorAll(':scope > details'))openBranch(d);
  });
  $('collapse').addEventListener('click',()=>{$('tree').querySelectorAll('details').forEach(d=>d.open=false);});
  // 50~150% 확대/축소를 제공한다. opaque-origin sandbox iframe의 localStorage 예외도 처리한다.
  const ZOOM_KEY='har-endpoint-tree-zoom';let zoom=100;try{zoom=Number(localStorage.getItem(ZOOM_KEY))||100;}catch{}
  function applyZoom(){zoom=Math.min(150,Math.max(50,zoom));$('zoomRoot').style.zoom=zoom+'%';$('zoomLevel').textContent=zoom+'%';try{localStorage.setItem(ZOOM_KEY,String(zoom));}catch{}}
  $('zoomIn').addEventListener('click',()=>{zoom+=10;applyZoom();});$('zoomOut').addEventListener('click',()=>{zoom-=10;applyZoom();});applyZoom();
})();
</script>
</body>
</html>
