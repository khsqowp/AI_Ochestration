# Cloudflare Tunnel proxies all public traffic through a single container connection, so nginx's own
# $remote_addr would see every visitor as the tunnel's one internal IP — Cf-Connecting-Ip carries the
# actual visitor IP and is what rate limiting needs to key on. Falls back to $remote_addr for direct/
# local access where that header isn't present.
map $http_cf_connecting_ip $real_client_ip {
  default $http_cf_connecting_ip;
  ""      $remote_addr;
}

limit_req_zone $real_client_ip zone=api_limit:10m rate=10r/s;
# Tighter ceilings for the two endpoints reachable without an app login, once the site is
# publicly exposed through the tunnel: the login POST (credential stuffing) and the public
# order upsert (name + 4-digit pin). Everything else keeps the general api_limit above.
limit_req_zone $real_client_ip zone=auth_limit:10m rate=20r/m;
limit_req_zone $real_client_ip zone=order_limit:10m rate=60r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /api/dolphin/chat {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Exact-match locations win over the /api/ prefix regardless of file order.
  location = /api/auth/login {
    limit_req zone=auth_limit burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location = /api/orders/mine {
    limit_req zone=order_limit burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    # Archive maintenance (and a few other endpoints) make several sequential LLM calls in one request —
    # nginx's 60s default proxy_read_timeout cut those off with a 504 well before the backend finished.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # nginx's own default (1MB) rejected file uploads before they ever reached Spring's 55MB multipart
    # limit (app.yml spring.servlet.multipart) -- keep this in sync with that value.
    client_max_body_size 55m;
  }

  # Vite 빌드 산출물은 파일명에 콘텐츠 해시가 박혀있어(index-XXXXXXXX.js) 내용이 바뀌면 URL도
  # 바뀐다 -- 브라우저가 이걸 1년간 캐시해도 안전하고, 그래야 cloudflared 터널(집 업로드 대역폭)로
  # 번들을 재배포 때마다가 아니라 "한 번만" 받는다. 이 location이 더 구체적이라 아래 location / 의
  # no-cache 보다 먼저 매치된다 — 그 no-cache는 index.html(해시 없음)에만 적용돼야 한다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    # Mirror every non-API hit (landing, /order, /login, /dashboard hard loads, path probes) to the
    # backend so 관리 › 접근기록 can map who is knocking. Fire-and-forget; nginx discards the response.
    mirror /_track;
    mirror_request_body off;

    try_files $uri $uri/ /index.html;
    # index.html has no hash in its filename (unlike /assets/*.js|css), so it's the one file that
    # changes on every deploy without a new URL to bust caches with -- without this, Cloudflare's edge
    # (and browsers) keep serving a stale shell pointing at JS bundles that no longer exist on origin.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /_track {
    internal;
    proxy_pass http://api:8080/api/internal/track;
    proxy_method POST;
    proxy_set_header Host $host;
    proxy_set_header Content-Length "";
    proxy_set_header X-Orig-URI $request_uri;
    proxy_set_header X-Orig-Method $request_method;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
    proxy_set_header CF-IPCity $http_cf_ipcity;
    proxy_set_header CF-Region $http_cf_region;
    proxy_set_header CF-IPLatitude $http_cf_iplatitude;
    proxy_set_header CF-IPLongitude $http_cf_iplongitude;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }
}
