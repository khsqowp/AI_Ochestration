services:
  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orchestration}
      MYSQL_USER: ${MYSQL_USER:-orchestrator}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    restart: unless-stopped

  db-backup:
    image: mysql:8.4.4
    environment:
      TZ: Asia/Seoul
      MYSQL_PWD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      DB_USER: ${MYSQL_USER:-orchestrator}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-orchestration}
      BACKUP_RETENTION_DAYS: "7"
    entrypoint: ["/bin/bash", "/scripts/db-backup.sh"]
    volumes:
      - ./scripts/db-backup.sh:/scripts/db-backup.sh:ro
      - ./backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]
    restart: unless-stopped

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-orchestration}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-orchestrator}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      ORIGINALS_PATH: /workspace/originals
      OBSIDIAN_PATH: /workspace/obsidian
      TRADING_STATE_PATH: /workspace/trading-state/funding_arb_state.json
      KR_TRADING_STATE_PATH: /workspace/trading-state-kr/kr_swing_state.json
      US_TRADING_STATE_PATH: /workspace/trading-state-us/us_swing_state.json
      MOMENTUM_ROTATION_TRADING_STATE_PATH: /workspace/trading-state-momentum-rotation/momentum_rotation_state.json
      TRX_TRADING_STATE_PATH: /workspace/trading-state-trx/trx_swing_state.json
      KR_ROTATION_TRADING_STATE_PATH: /workspace/trading-state-kr-rotation/stock_rotation_state.json
      US_ROTATION_TRADING_STATE_PATH: /workspace/trading-state-us-rotation/stock_rotation_state.json
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./originals:/workspace/originals
      - ./obsidian:/workspace/obsidian
      - trading_paper_state:/workspace/trading-state:ro
      - trading_kr_swing_state:/workspace/trading-state-kr:ro
      - trading_us_swing_state:/workspace/trading-state-us:ro
      - trading_momentum_rotation_state:/workspace/trading-state-momentum-rotation:ro
      - trading_trx_swing_state:/workspace/trading-state-trx:ro
      - trading_kr_rotation_state:/workspace/trading-state-kr-rotation:ro
      - trading_us_rotation_state:/workspace/trading-state-us-rotation:ro
    networks: [private, app]
    restart: unless-stopped

  trading:
    build: ./trading
    env_file:
      - path: .env
        required: false
    networks: [app]
    profiles: ["trading"]

  trading-paper-funding-arb:
    build: ./trading
    entrypoint: ["python", "-m", "app.paper_trade_loop"]
    env_file:
      - path: .env
        required: false
    environment:
      # TRX 스윙 봇으로 자금 이관 진행중 — 보유 포지션은 기존 청산조건대로 자동 매도되지만 재진입은 안 함.
      FUNDING_ARB_HALT_NEW_ENTRIES: "true"
    volumes:
      - trading_paper_state:/app/data
    networks: [app]
    profiles: ["paper-trading"]
    restart: unless-stopped

  trading-kr-swing:
    build: ./trading
    entrypoint: ["python", "-u", "-m", "app.kr_swing_loop"]
    env_file:
      - path: .env
        required: false
    environment:
      TICK_STATE_PATH: /app/tick-state/tick_state.json
    volumes:
      - trading_kr_swing_state:/app/data
      - trading_tick_state:/app/tick-state:ro
    networks: [app]
    profiles: ["kr-swing"]
    restart: unless-stopped

  trading-us-swing:
    build: ./trading
    entrypoint: ["python", "-u", "-m", "app.us_swing_loop"]
    env_file:
      - path: .env
        required: false
    environment:
      TICK_STATE_PATH: /app/tick-state/tick_state.json
    volumes:
      - trading_us_swing_state:/app/data
      - trading_tick_state:/app/tick-state:ro
    networks: [app]
    profiles: ["us-swing"]
    restart: unless-stopped

  # 국장/미장 top-N 모멘텀 로테이션 페이퍼봇 (KIS 모의) — EMA 크로스 스윙 대체 테스트.
  # 같은 모의계좌를 쓰므로 kr-swing/us-swing 과 동시 기동 금지.
  trading-kr-rotation:
    build: ./trading
    entrypoint: ["python", "-u", "-m", "app.stock_rotation_loop"]
    env_file:
      - path: .env
        required: false
    environment:
      ROTATION_MARKET: KR
      ROTATION_LOOKBACK: "20"
      ROTATION_REBAL_DAYS: "10"
      ROTATION_TOP_K: "8"
      ROTATION_REGIME: ew_sma200
      ROTATION_BUDGET: "4000000"
      ROTATION_STATE_PATH: /app/data/stock_rotation_state.json
    volumes:
      - trading_kr_rotation_state:/app/data
      - ./.kis-cache:/app/cache
    networks: [app]
    profiles: ["kr-rotation"]
    restart: unless-stopped

  trading-us-rotation:
    build: ./trading
    entrypoint: ["python", "-u", "-m", "app.stock_rotation_loop"]
    env_file:
      - path: .env
        required: false
    environment:
      ROTATION_MARKET: US
      ROTATION_LOOKBACK: "120"
      ROTATION_REBAL_DAYS: "20"
      ROTATION_TOP_K: "8"
      ROTATION_REGIME: ew_sma200
      ROTATION_BUDGET: "2800"
      ROTATION_STATE_PATH: /app/data/stock_rotation_state.json
    volumes:
      - trading_us_rotation_state:/app/data
      - ./.kis-cache:/app/cache
    networks: [app]
    profiles: ["us-rotation"]
    restart: unless-stopped

  trading-trx-swing:
    build: ./trading
    entrypoint: ["python", "-u", "-m", "app.trx_swing_loop"]
    env_file:
      - path: .env
        required: false
    volumes:
      - trading_trx_swing_state:/app/data
    networks: [app]
    profiles: ["trx-swing"]
    restart: unless-stopped

  trading-momentum-rotation:
    build: ./trading
    entrypoint: ["python", "-u", "-m", "app.momentum_rotation_loop"]
    env_file:
      - path: .env
        required: false
    environment:
      CRYPTO_TICK_STATE_PATH: /app/crypto-tick-state/crypto_tick_state.json
      # 실거래 — 자본 145 USDT 중 70 배치, 2배, 달러중립 14/3/8.
      # 디레버: 고점대비 -20% 에서 배율 2->1. 킬: -35% 에서 전량청산+정지(RESET_HALT=true 로 재개).
      MOMENTUM_ROTATION_LIVE: "true"
      MOMENTUM_ROTATION_EXCHANGE: mainnet
      MOMENTUM_ROTATION_LEVERAGE: "2"
      # 리밸런스 3->2일: 14일 상대모멘텀 신호가 빨리 감쇠, 2일이 현실 비용(편도 0.10%) 반영
      # Calmar/Sharpe/CAGR 최적 (백테스트 2022-2026). 1일은 회전율 155x로 비용에 잠식됨.
      MOMENTUM_ROTATION_REBALANCE_DAYS: "2"
      MOMENTUM_ROTATION_MAX_DEPLOY_USDT: "70"
      MOMENTUM_ROTATION_DELEVER_DD: "0.20"
      MOMENTUM_ROTATION_KILL_DD: "0.35"
    volumes:
      - trading_momentum_rotation_state:/app/data
      - trading_crypto_tick_state:/app/crypto-tick-state:ro
    networks: [app]
    profiles: ["momentum-rotation"]
    restart: unless-stopped

  trading-crypto-tick-stream:
    build: ./trading
    entrypoint: ["python", "-u", "-m", "app.crypto_tick_stream"]
    volumes:
      - trading_crypto_tick_state:/app/data
      - ./trading-tick-archive:/app/archive
    networks: [app]
    profiles: ["crypto-tick-stream"]
    restart: unless-stopped

  trading-tick-stream:
    build: ./trading
    entrypoint: ["python", "-u", "-m", "app.tick_stream"]
    env_file:
      - path: .env
        required: false
    environment:
      KR_SWING_STATE_PATH: /app/kr-state/kr_swing_state.json
      US_SWING_STATE_PATH: /app/us-state/us_swing_state.json
    volumes:
      - trading_tick_state:/app/data
      - trading_kr_swing_state:/app/kr-state:ro
      - trading_us_swing_state:/app/us-state:ro
      - ./trading-tick-archive:/app/archive
    networks: [app]
    profiles: ["tick-stream"]
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on: [api]
    ports:
      - "5173:80"
    networks: [app]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [web]
    networks: [app]
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.26.8
    env_file:
      - path: .env
        required: false
    environment:
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set in .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./originals:/workspace/originals:ro
      - ./obsidian:/workspace/obsidian
      - ./n8n/workflows:/workflows:ro
    networks: [app]
    restart: unless-stopped

volumes:
  mysql_data:
  n8n_data:
  trading_paper_state:
  trading_kr_swing_state:
  trading_us_swing_state:
  trading_momentum_rotation_state:
  trading_kr_rotation_state:
  trading_us_rotation_state:
  trading_trx_swing_state:
  trading_tick_state:
  trading_crypto_tick_state:

networks:
  private:
    internal: true
  app:
