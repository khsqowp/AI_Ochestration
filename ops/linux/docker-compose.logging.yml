name: ochestration-logging
services:
  vector:
    image: timberio/vector:0.61.0-debian
    command: ["--config", "/etc/vector/vector.yaml"]
    user: "1000:1000"
    group_add: ["${DOCKER_GID:-984}"]
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/noroot/CODE/Ochestration/ops/linux/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /home/noroot/logs/site:/home/noroot/logs/site
      - /home/noroot/.local/state/ochestration/vector:/var/lib/vector
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
